  />
  <rect
    x="8"
    y="8"
    width="284"
    height="48"
    rx="11"
    fill="none"
    stroke="#2f7dff"
    stroke-opacity="0.4"
  />

  <path d="M64 19.5 L87 32 L64 44.5 Z" fill="url(#oro)" />
  <text
    x="101"
    y="40.5"

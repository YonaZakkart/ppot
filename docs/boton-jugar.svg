<svg xmlns="http://www.w3.org/2000/svg" width="300" height="64" viewBox="0 0 300 64" role="img" aria-label="Play Game">
  <defs>
    <linearGradient id="oro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe28a" />
      <stop offset="0.55" stop-color="#ffc637" />
      <stop offset="1" stop-color="#ff9f1c" />
    </linearGradient>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151f36" />
      <stop offset="1" stop-color="#05070e" />
    </linearGradient>
    <filter id="brillo" x="-40%" y="-80%" width="180%" height="260%">
